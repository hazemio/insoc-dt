[project]
name = "insoc-dt"
version = "0.1.0"
description = "Intelligent Network Security & Digital Twin SOC"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
